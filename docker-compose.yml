services:
  db:
    image: postgres:16
    container_name: my_postgres_cars
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
    - "${MY_PERSONAL_DB_PORT}:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
    name: backend_pgdata